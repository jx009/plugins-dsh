home:
  title: "DeepSeek Harness Plugins Directory | {brand}"
  description: "Find DeepSeek Harness (DSH) plugins by what they do, compare stars and recent activity, and copy the install command. Updated daily, with setup tutorials."
  h1: "Find a DeepSeek Harness plugin and install it"
  lede: "{count} community plugins for DSH, sorted by what they change. Pick one, copy one command, and it is running in your harness."
  finderLabel: "What should your harness do?"
  finderPlaceholder: "Try “memory”, “remote” or “theme”"
  finderPopular: Most starred
  finderResults: Matches
  finderAll: See all plugins
  bayHeading: Browse by what the plugin changes
  latestHeading: Recently added
  latestAll: All plugins, newest first
  stepsHeading: From zero to a running plugin
  steps:
    - title: Start the harness
      body: "You need Node.js. This starts the web UI on your own machine at 127.0.0.1:3080."
      cmd: "npx @deepseek-ai/dsh web"
    - title: Add a plugin
      body: "Each plugin page here gives you this line with the package name filled in."
      cmd: "dsh plugin --profile web add <package>"
    - title: Check what loaded
      body: "Prints the final configuration for the profile, so you can see whether the plugin is in it."
      cmd: "dsh --profile web --dump-config"
  tutorialsHeading: Tutorials
  tutorialsLede: "Install, configure, update and fix DSH plugins, one task per page."
  tutorialsAll: All tutorials
  faqHeading: Common questions about DSH plugins
  faq:
    - q: "What is a DeepSeek Harness plugin?"
      a: "DeepSeek Harness (`dsh`) is an open-source agent harness built so that everything in it is a plugin: model adapters, tools, the web UI, storage. A community plugin adds to or replaces one of those parts, for example a chat bridge, a memory store or a theme."
    - q: "How do I install a DSH plugin?"
      a: "Most plugins published to npm install with `dsh plugin --profile web add <package>`. Each plugin page on {brand} shows the exact line. Some plugins are not on npm and install from source instead, in which case the page points you to the steps in their readme."
    - q: "What does the profile in the install command mean?"
      a: "A profile is a named setup of the harness. The shipped ones are `web`, `headless`, `sdk`, `sdk-minimal` and `acp`. A plugin is added to one profile, so if you run the harness headless, swap `web` for `headless` in the command."
    - q: "Are the plugins listed here safe to install?"
      a: "They are third-party code and {brand} does not audit them. A plugin runs with the same access as the harness itself, so check the repository, its recent activity and its open issues first. A “verified” mark here only means we installed it once and it loaded."
    - q: "Is DeepSeek Harness stable enough to rely on plugins?"
      a: "The harness is in developer preview and its maintainers say plainly that breaking changes will come. Expect plugins to stop working after some updates, and check a plugin's last push date before you depend on it."
    - q: "How do I get my plugin listed?"
      a: "Add the `dsh-plugin` topic to your GitHub repository so it can be found, then send it through the [submit page](/submit). Listing is free."

plugins:
  title: "All DSH Plugins for DeepSeek Harness"
  description: "Every DeepSeek Harness plugin in the directory, with GitHub stars, last push date and install command. Filter by name or sort by activity to find one that fits."
  h1: "All DSH plugins for DeepSeek Harness"
  lede: "{count} plugins. Each row links to a page with the install command, what the plugin does and how current it is."
  filterLabel: Filter this list
  filterPlaceholder: "Name, author or keyword"
  sortLabel: Sort by
  sort:
    stars: Most stars
    updated: Recently updated
    listed: Recently added
    name: Name
  count: "1 plugin|{n} plugins"
  empty: "No plugins in this category yet. If you know one, send it through the submit page."
  faq:
    - q: "How are the plugins on this page ordered?"
      a: "By GitHub stars, highest first. Stars show how many people noticed a project, not whether it still works, so read the last push date next to them."
    - q: "How often is the list updated?"
      a: "New plugins are added most days. Stars, versions and push dates are refreshed from GitHub on a regular schedule, and each plugin page shows the dates it is working from."
    - q: "Why does a plugin show no install command?"
      a: "The one-line command needs an npm package. Plugins that are not published to npm, or that ship as a desktop app or a script, are installed the way their readme describes."
  terms:
    - name: Plugin
      desc: "A package the harness loads to add or replace a capability. In DeepSeek Harness even the built-in parts are plugins."
    - name: Profile
      desc: "A named composition of the harness, such as `web` or `headless`, that decides which bundles and plugins are loaded."
    - name: Bundle
      desc: "A packaged set of configuration and the code it mounts. A profile stacks one or more bundles."

