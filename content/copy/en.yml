tutorials:
  title: "DSH Plugin Tutorials for DeepSeek Harness"
  description: "Step-by-step DeepSeek Harness tutorials: install the harness, add and configure plugins, update safely, remove cleanly and fix the errors people hit most."
  h1: "DSH plugin tutorials for DeepSeek Harness"
  lede: "One task per page, with the commands written out. Start with the concepts if profiles and bundles are new to you."
  all: All tutorials
  catTitle: "{name} tutorials for DSH plugins"
  catDescription: "{tagline} Step-by-step {name} guides for DeepSeek Harness plugins, with every command written out."
  empty: "No tutorials in this section yet."
  faq:
    - q: "Where should I start if I have never used DeepSeek Harness?"
      a: "Read a concepts guide first so the words profile, bundle and patch make sense, then follow an install guide. After that the configuration and troubleshooting pages are easier to use as reference."
    - q: "Do these tutorials replace the official documentation?"
      a: "No. The official docs describe the harness itself. These pages cover the community plugin side: choosing, installing and fixing third-party plugins. Each tutorial lists its sources."
    - q: "Will the commands still work after the harness updates?"
      a: "The harness is in developer preview, so some will change. Every tutorial shows when it was last updated; if a command fails, compare that date with the release you are running."
  terms:
    - name: Developer preview
      desc: "The current release stage of DeepSeek Harness. Interfaces can change between versions without a compatibility promise."
    - name: Patch file
      desc: "`cordis.patch.yml`, kept inside a profile. It records your own changes on top of what the profile's bundles provide."
    - name: Harness home
      desc: "The directory where the harness keeps its profiles, installed plugins and settings."

