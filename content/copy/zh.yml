home:
  title: "DeepSeek Harness 插件大全 | {brand}"
  description: "按用途查找 DeepSeek Harness（DSH）插件，对比星标数和最近更新时间，一键复制安装命令。每日更新，附安装、配置与排错教程。"
  h1: "找到合适的 DeepSeek Harness 插件，装上就用"
  lede: "收录 {count} 个 DSH 社区插件，按它们改变的东西分类。选一个，复制一条命令，就能在你的 Harness 里跑起来。"
  finderLabel: "想让你的 Harness 做什么？"
  finderPlaceholder: "试试“记忆”“远程”或“主题”"
  finderPopular: 星标最多
  finderResults: 匹配结果
  finderAll: 查看全部插件
  bayHeading: 按插件改变的东西浏览
  latestHeading: 最近收录
  latestAll: 全部插件，按收录时间排序
  stepsHeading: 从零到跑起第一个插件
  steps:
    - title: 启动 Harness
      body: "需要先装好 Node.js。这条命令会在本机 127.0.0.1:3080 启动 Web UI。"
      cmd: "npx @deepseek-ai/dsh web"
    - title: 添加插件
      body: "本站每个插件页都会给出这条命令，并填好包名。"
      cmd: "dsh plugin --profile web add <package>"
    - title: 确认已加载
      body: "打印这个 profile 的最终配置，看插件是否在其中。"
      cmd: "dsh --profile web --dump-config"
  tutorialsHeading: 教程
  tutorialsLede: "DSH 插件的安装、配置、更新和排错，一页只讲一件事。"
  tutorialsAll: 全部教程
  faqHeading: 关于 DSH 插件的常见问题
  faq:
    - q: "DeepSeek Harness 插件是什么？"
      a: "DeepSeek Harness（`dsh`）是一个开源的智能体运行框架，它的一切组成部分都是插件：模型适配、工具、Web UI、存储。社区插件就是往里添加或替换其中某一块，比如聊天软件桥接、记忆存储或界面主题。"
    - q: "DSH 插件怎么安装？"
      a: "发布到 npm 的插件大多用 `dsh plugin --profile web add <包名>` 安装，{brand} 的每个插件页都写了完整命令。有些插件不在 npm 上，需要从源码安装，这种情况页面会指向它 README 里的步骤。"
    - q: "安装命令里的 profile 是什么意思？"
      a: "profile 是 Harness 的一套具名配置，自带的有 `web`、`headless`、`sdk`、`sdk-minimal` 和 `acp`。插件是装进某一个 profile 的，如果你用 headless 方式运行，就把命令里的 `web` 换成 `headless`。"
    - q: "这里收录的插件安全吗？"
      a: "它们都是第三方代码，{brand} 不做安全审计。插件拥有和 Harness 本身相同的权限，安装前请看一下仓库、近期活跃度和未解决的 issue。本站的“已验证安装”标记只表示我们装过一次并且能加载。"
    - q: "DeepSeek Harness 够稳定吗，能长期依赖插件吗？"
      a: "Harness 目前处于 developer preview 阶段，维护者明确说过会有不兼容的改动。某次更新后插件失效是正常情况，依赖某个插件之前先看它最近一次推送的时间。"
    - q: "怎么让我的插件被收录？"
      a: "先给 GitHub 仓库加上 `dsh-plugin` 这个 topic 方便被发现，再通过[提交页面](/submit)发给我们。收录免费。"

plugins:
  title: "DeepSeek Harness 全部 DSH 插件列表"
  description: "本站收录的全部 DeepSeek Harness 插件，附 GitHub 星标数、最近推送时间和安装命令。可按名称筛选、按活跃度排序，快速找到合适的一个。"
  h1: "DeepSeek Harness 全部 DSH 插件"
  lede: "共 {count} 个插件。每一行都通向详情页，里面有安装命令、功能说明和维护状态。"
  filterLabel: 筛选列表
  filterPlaceholder: "名称、作者或关键词"
  sortLabel: 排序
  sort:
    stars: 星标最多
    updated: 最近更新
    listed: 最近收录
    name: 名称
  count: "{n} 个插件"
  empty: "这个分类下还没有插件。如果你知道合适的，欢迎通过提交页面告诉我们。"
  faq:
    - q: "这一页的插件按什么排序？"
      a: "默认按 GitHub 星标数从高到低。星标只说明有多少人关注过这个项目，不代表它现在还能用，所以要结合旁边的最近推送时间一起看。"
    - q: "列表多久更新一次？"
      a: "基本每天都有新插件加入。星标数、版本号和推送时间会定期从 GitHub 刷新，每个插件页都标明了数据的日期。"
    - q: "为什么有的插件没有安装命令？"
      a: "一行安装命令需要插件发布到 npm。没有发布到 npm 的插件，或者以桌面应用、脚本形式分发的，要按它 README 里的方式安装。"
  terms:
    - name: 插件
      desc: "Harness 加载的一个包，用来增加或替换某项能力。在 DeepSeek Harness 里，连内置部分也是插件。"
    - name: Profile
      desc: "Harness 的一套具名组合，例如 `web` 或 `headless`，决定加载哪些 bundle 和插件。"
    - name: Bundle
      desc: "打包好的一组配置及其挂载的代码。一个 profile 由一个或多个 bundle 叠加而成。"

