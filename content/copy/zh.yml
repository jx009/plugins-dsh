tutorials:
  title: "DeepSeek Harness 插件教程：安装、配置与排错"
  description: "DeepSeek Harness 分步教程：安装 Harness、添加和配置插件、安全更新、彻底卸载，以及最常见报错的解决办法。命令全部写明，可直接复制。"
  h1: "DeepSeek Harness 插件教程"
  lede: "一页只讲一件事，命令全部写出来。如果 profile 和 bundle 这些词还陌生，先从概念类读起。"
  all: 全部教程
  catTitle: "DSH 插件{name}教程"
  catDescription: "{tagline}DeepSeek Harness 插件{name}相关的分步教程，每条命令都完整写出。"
  empty: "这个栏目下还没有教程。"
  faq:
    - q: "从没用过 DeepSeek Harness，应该从哪里开始？"
      a: "先读一篇概念类教程，弄清 profile、bundle、patch 这几个词，再跟着安装教程做一遍。之后配置和排错类的页面就可以当手册随用随查。"
    - q: "这些教程能代替官方文档吗？"
      a: "不能。官方文档讲的是 Harness 本身，这里讲的是社区插件这一侧：怎么选、怎么装、出了问题怎么修。每篇教程末尾都列出了参考来源。"
    - q: "Harness 更新之后，教程里的命令还能用吗？"
      a: "Harness 处于 developer preview 阶段，部分命令会变。每篇教程都标了最后更新日期，命令失败时先对照一下这个日期和你正在用的版本。"
  terms:
    - name: Developer preview
      desc: "DeepSeek Harness 当前所处的发布阶段，接口可能在版本之间变化，不保证兼容。"
    - name: Patch 文件
      desc: "即 `cordis.patch.yml`，保存在 profile 里，记录你在 bundle 默认内容之上做的改动。"
    - name: Harness 主目录
      desc: "Harness 存放 profile、已安装插件和设置的目录。"

